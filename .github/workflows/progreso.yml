name: Actualizar progreso

on:
  push:
    branches: [Pablo]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  progreso:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Comprobar sintaxis de los JS
        run: node tools/check.js
        continue-on-error: true

      - name: Regenerar PROGRESO.md
        run: node tools/generar-progreso.js

      - name: Commit si ha cambiado
        run: |
          if git diff --quiet; then
            echo "PROGRESO.md ya estaba al día."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(progreso): actualizar PROGRESO.md [skip ci]"
          git push
