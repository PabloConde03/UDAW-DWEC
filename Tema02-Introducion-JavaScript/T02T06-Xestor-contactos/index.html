<!DOCTYPE html>
<html lang="gl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axenda de Contactos</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <div class="contedor-principal">
        <h1>Xestor de Contactos 🧑‍🤝‍🧑</h1>

        <div class="contedor-datos">
            <div class="contedor">
                <h2>Contacto</h2>
                <form id="formulario-contacto">
                    <label for="nome">Nome: *</label>
                    <input type="text" id="nome" required>

                    <label for="apelidos">Apelidos:</label>
                    <input type="text" id="apelidos">

                    <label for="telefono">Teléfono:</label>
                    <input type="tel" id="telefono">

                    <label for="email">Email:</label>
                    <input type="email" id="email">

                    <label for="data-aniversario">Aniversario:</label>
                    <input type="date" id="data-aniversario">

                    <label for="direccion">Dirección:</label>
                    <input type="text" id="direccion">

                    <input type="hidden" id="contacto-id-oculto" value="">

                    <div class="contedor-btns">
                        <button type="button" id="btn-crear" onclick="xestionarContacto('crear')">💾 Crear</button>
                        <button type="button" id="btn-modificar" onclick="xestionarContacto('modificar')" disabled>✏️ Modificar</button>
                        <button type="button" id="btn-buscar" onclick="xestionarContacto('buscar')">🔍 Buscar</button>
                        <button type="button" id="btn-limpar" onclick="limparFormulario()">🔄 Limpar</button>
                    </div>
                </form>
            </div>

            <div class="contedor">
                <h2>Listaxe de Contactos</h2>
                <div class="opcions-ordenacion">
                    <p>Ordenar por:</p>
                    <button type="button" onclick="ordenarContactos('nome')">Nome</button>
                    <button type="button" onclick="ordenarContactos('apelidos')">Apelidos</button>
                    <button type="button" onclick="ordenarContactos('aniversario')">Aniversario</button>
                </div>
                <ul id="lista-contactos"></ul>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
