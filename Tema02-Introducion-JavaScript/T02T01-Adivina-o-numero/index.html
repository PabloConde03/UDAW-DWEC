<!DOCTYPE html>
<html lang="gl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adiviña o Número</title>
    <link rel="stylesheet" href="estilos.css">
    <script src="t02t01.js" defer></script>
</head>
<body>
    <div class="contedor">
        <h1>Adiviña o Número</h1>
        <p>Teño en mente un número entre 1 e 100.<br>Cantos intentos precisarás para adiviñalo?</p>

        <div class="area-xogo">
            <input type="number" id="xogada" min="1" max="100" placeholder="Insire a túa suposición">
            <button id="boton-entrada" onclick="comprobarSuposicion()">Adiviñar</button>
        </div>

        <div class="area-resultado">
            <p id="mensaxe"></p>
            <p id="intentos"></p>
        </div>
    </div>
</body>
</html>
